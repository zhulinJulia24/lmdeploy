# HF model id: Qwen/Qwen3-30B-A3B

a100:
- model_type: chat
  engine_config:
    tp: 2
    extra:
      session-len: 65536
  backends:
  - name: turbomind
    communicators:
    - nccl
    - cuda-ipc
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - benchmark
  - evaluate
  - func
  - longtext_benchmark
  - prefix_cache
  quantization:
    turbomind:
    - kvint8
    pytorch:
    - kvint8
  gen_config:
    temperature: 0.6
- model_type: chat
  engine_config:
    tp: 2
    extra:
      logprobs-mode: raw_logprobs
      enable-return-routed-experts: true
  backends:
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - interface
  interface:
  - chat_completions_v1
  - generate_logprob
  - generate_experts
- model_type: chat
  engine_config:
    tp: 2
    extra:
      logprobs-mode: raw_logprobs
