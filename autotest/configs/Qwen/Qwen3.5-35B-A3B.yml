# HF model id: Qwen/Qwen3.5-35B-A3B

a100:
- model_type: chat
  engine_config:
    tp: 2
  backends:
  - name: turbomind
    communicators:
    - nccl
    - cuda-ipc
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - func
  quantization:
    turbomind:
    - kvint8
    pytorch:
    - kvint8
- model_type: vl
  engine_config:
    tp: 2
  backends:
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - func
  quantization:
    pytorch:
    - kvint8
- model_type: chat
  engine_config:
    tp: 2
    extra:
      logprobs-mode: raw_logprobs
      enable-return-routed-experts: true
  backends:
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - interface
  interface:
  - chat_completions_v1
  - generate_logprob
  - generate_experts
- model_type: chat
  engine_config:
    tp: 2
    extra:
      logprobs-mode: raw_logprobs
  backends:
  - name: turbomind
    communicators:
    - nccl
  test_coverage:
  - interface
  interface:
  - chat_completions_v1
  - generate_logprob
- model_type: chat
  engine_config:
    tp: 2
    extra:
      reasoning-parser: qwen-qwq
      speculative-algorithm: qwen3_5_mtp
      speculative-num-draft-tokens: 4
      max-batch-size: 256
  backends:
  - name: turbomind
    communicators:
    - nccl
    - cuda-ipc
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - func
- model_type: vl
  engine_config:
    tp: 2
    extra:
      reasoning-parser: qwen-qwq
      speculative-algorithm: qwen3_5_mtp
      speculative-num-draft-tokens: 4
      max-batch-size: 256
  backends:
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - func
- model_type: chat
  engine_config:
    tp: 2
    extra:
      reasoning-parser: qwen-qwq
      tool-call-parser: qwen3coder
  backends:
  - name: turbomind
    communicators:
    - nccl
  - name: pytorch
    communicators:
    - nccl
  test_coverage:
  - interface
  interface:
  - reasoning_parser
  - tool_parser
  gen_config:
    chat-template-kwargs:
      enable_thinking: true
